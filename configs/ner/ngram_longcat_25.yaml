# LongCat N-gram (25%) — LoRA NER Fine-Tuning (JSON format)
checkpoint: /workspace/moe/checkpoints/longcat_ngram_25/step_003053_hf
method: lora
attn_implementation: sdpa
output_format: json

# Dataset
dataset: few-nerd
max_seq_len: 1024
train_limit: null
eval_limit: null

# Training
epochs: 2
max_steps: -1
batch_size: 30
grad_accum: 4
lr: 0.00003
warmup_ratio: 0.10
optim: adamw_torch_fused
grad_checkpointing: true
